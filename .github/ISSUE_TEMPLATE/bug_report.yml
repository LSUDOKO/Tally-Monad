name: Bug report
description: Something in Tally does not work as described.
title: "Bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Tally runs on **Monad Testnet** only.
        **Never post a recovery phrase, private key or API key.** For a security issue, use a [private report](https://github.com/LSUDOKO/Tally-Monad/security/advisories/new) instead.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Web app (allowance, scan, pay)
        - Web app (merchant mode, family top-up)
        - On-chain program
        - TypeScript SDK or scripts
        - Tally cloud (counter, MCP server)
        - Telegram bot or payment alerts
        - Docs
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. Include the exact message on screen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Scan the live counter
        2. Ask the agent for an oat latte
        3. ...
    validations:
      required: true
  - type: input
    id: tx
    attributes:
      label: Monad Testnet transaction hash
      description: If a payment or wallet action failed, the hash lets us read the contract revert.
  - type: input
    id: version
    attributes:
      label: Tally version
      description: Settings → About, or the release you installed.
      placeholder: "1.2.0"
  - type: input
    id: device
    attributes:
      label: Phone, browser and passkey provider
      placeholder: Pixel 8, Chrome 141, Google Password Manager
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Check that no keys or private information are visible.
